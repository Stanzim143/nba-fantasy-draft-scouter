version: 2
updates:
  # Workflow actions (actions/checkout, actions/setup-python, ...).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # CI lint toolchain pin (.github/requirements-lint.txt).
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"

  # Project dependencies declared in pyproject.toml.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      python-dependencies:
        patterns: ["*"]
