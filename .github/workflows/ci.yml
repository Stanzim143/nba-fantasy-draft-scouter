name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI only checks code out and runs tests.
permissions:
  contents: read

# A newer push to the same ref supersedes the run still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    defaults:
      run:
        shell: bash
    env:
      # Tests must never touch a developer's shared data dir; everything goes to a scratch dir.
      NBA_DATA_DIR: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # pyproject.toml is the single source of truth for dependencies; install its dependency list
      # plus the `dev` extra directly (the tests run from the source tree, not an installed package).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python - <<'PY' > "$RUNNER_TEMP/requirements-ci.txt"
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              project = tomllib.load(fh)["project"]
          print("\n".join(project["dependencies"] + project["optional-dependencies"]["dev"]))
          PY
          python -m pip install -r "$RUNNER_TEMP/requirements-ci.txt"

      # Runs the whole suite, leakage tests included. Tests marked `network` are excluded by
      # default (see [tool.pytest.ini_options] in pyproject.toml); nothing here needs the internet.
      - name: Run tests
        run: python -m pytest -ra

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-lint.txt

      - name: Install ruff
        run: python -m pip install -r .github/requirements-lint.txt

      - name: Ruff
        run: bash ./dev lint
        env:
          DEV_REQUIRE_LINT: "1"  # fail instead of falling back to the syntax-only check
